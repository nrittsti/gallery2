name: Upload Distribution
on:
  workflow_dispatch:
jobs:
  upload:
    name: 'Upload to Production Environment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: 'npm ic'
        run: npm ci
      - name: 'npm build'
        run: npm run build
      - name: 'Upload'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.webclient4.de
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PW }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /html/
  validate:
    name: 'Validate Production Environment with Playwright'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: upload
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: 'Install dependencies'
        run: npm ci
      - name: 'Install Playwright Browsers'
        run: npx playwright install --with-deps
      - name: 'Clean dist directory'
        run: 'rm -rf dist'
      - name: 'Run Playwright prod tests'
        run: BASE_URL=https:nicorittstieg.de npx playwright test
      - name: 'Upload Html Report'
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: 'Upload Video'
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-video
          path: test-results/
          retention-days: 30
