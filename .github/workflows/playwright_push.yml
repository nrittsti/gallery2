name: Playwright Push Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    name: 'Verification Gates (lint → build → unit → e2e)'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: 'Install dependencies'
        run: npm ci
      - name: 'Lint'
        run: npm run lint
      - name: 'Install Playwright Browsers'
        run: npx playwright install --with-deps
      - name: 'Clean dist directory'
        run: 'rm -rf dist'
      - name: 'Build'
        run: npm run build
      - name: 'Unit Tests'
        run: npm run test:unit
      - name: 'E2E Tests'
        run: npm run test:e2e
      - name: 'Upload Html Report'
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: 'Upload Video'
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-video
          path: test-results/
          retention-days: 30
